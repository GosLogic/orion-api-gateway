spring.application.name=orion-api-gateway
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Swagger UI — agrega los api-docs de cada microservicio como tabs seleccionables
springdoc.swagger-ui.urls[0].name=IAM Service
springdoc.swagger-ui.urls[0].url=http://localhost:8081/v3/api-docs
springdoc.swagger-ui.urls[1].name=Dispatch Service
springdoc.swagger-ui.urls[1].url=http://localhost:8082/v3/api-docs
springdoc.swagger-ui.urls[2].name=Fleet Service
springdoc.swagger-ui.urls[2].url=http://localhost:8083/v3/api-docs
springdoc.swagger-ui.urls[3].name=Maintenance Service
springdoc.swagger-ui.urls[3].url=http://localhost:8084/v3/api-docs
springdoc.swagger-ui.urls[4].name=Telemetry Service
springdoc.swagger-ui.urls[4].url=http://localhost:8085/v3/api-docs
springdoc.swagger-ui.urls[5].name=Notification Service
springdoc.swagger-ui.urls[5].url=http://localhost:8086/v3/api-docs
springdoc.swagger-ui.use-root-path=true

